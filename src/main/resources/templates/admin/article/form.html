<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{_layout}">
<!--<head>-->
<head>
    <meta charset="UTF-8">
    <title>Form Article</title>
</head>
<body>
<div layout:fragment="content">
<!--<h1>List User</h1>-->
    <div class="container">
        <div class="row" style="padding-top: 20px !important;">
            <div class="col-md-6">
                <h5>Form Article</h5>
            </div>
            <div class="col-md-6">
                <a class="btn btn-primary btn-sm float-end" th:href="@{/admin/articles}">Back</a>
            </div>
        </div>
        <br>
        <hr>
        <div class="row">
            <form th:action="@{/admin/articles/create}" method="post" th:object="${article}">
                <input type="text" hidden th:field="*{id}">
                <div class="mb-3">
                    <label class="form-label"></label>
<!--                    <option value=""></option>-->
                    <select class="form-select" th:field="*{category}">
                        <option th:each="data: ${article.getCategoryList()}"
                        th:value="${data.getId()}"
                                th:text="${data.name}">

                        </option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Title</label>
                    <input type="text" class="form-control" th:field="*{title}" placeholder="title">
                </div>
                <div class="mb-3">
                    <label class="form-label">Description</label>
<!--                    <input type="text" class="form-control" th:field="*{phoneNumber}" placeholder="phone">-->
                    <textarea class="form-control" th:field="*{description}" style="height: 200px" ></textarea>
                </div>
<!--                <div class="mb-3">-->
<!--                    <label class="form-label">Email</label>-->
<!--                    <input type="text" class="form-control" th:field="*{email}" placeholder="email">-->
<!--                </div>-->
<!--                <div class="mb-3">-->
<!--                    <label class="form-label">Password</label>-->
<!--                    <input type="text" class="form-control" th:field="*{password}" placeholder="password">-->
<!--                </div>-->
                <div class="mb-3">
                    <label class="form-label"></label>
                    <!--                    <option value=""></option>-->
                    <select class="form-select" th:field="*{status}">
                        <option th:each="data: ${article.getStatusList()}"
                                th:value="${data.getKey()}"
                                th:text="${data.getValue()}">

                        </option>
                    </select>
                </div>
                <div class="mb-3">
                    <button th:if="*{id==0}" class="btn btn-primary btn-sm btn-block">Create</button>
                    <button th:if="*{id!=0}" class="btn btn-primary btn-sm btn-block">Update</button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
